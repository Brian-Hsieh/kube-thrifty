apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-informer-deployment"
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-informer"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-informer"
    spec:
      containers:
        - name: informer
          image: "{{ .Values.informer.image.repo }}:{{ .Values.informer.image.tag}}"
          imagePullPolicy: Never
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
